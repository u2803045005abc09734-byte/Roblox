name: Windows-exe bauen

on:
  push:
    branches: [main]      # läuft automatisch bei jedem Hochladen
  workflow_dispatch:      # oder manuell per Knopfdruck

permissions:
  contents: write         # nötig, um die exe als Release zu veröffentlichen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests (Speicher + Status-Auswertung)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: exe bauen
        run: pyinstaller --noconfirm --windowed --name RobloxAccountSwitcher app.py

      - name: Zip erstellen
        run: Compress-Archive -Path dist/RobloxAccountSwitcher -DestinationPath RobloxAccountSwitcher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RobloxAccountSwitcher-windows
          path: RobloxAccountSwitcher-windows.zip

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Account Switcher Build ${{ github.run_number }}
          files: RobloxAccountSwitcher-windows.zip
